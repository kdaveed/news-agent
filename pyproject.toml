[project]
name = "newsalert"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "jinja2>=3.1,<4",
  "pwdlib[argon2]>=0.2,<1",
  "itsdangerous>=2.2,<3",
  "email-validator>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "duckdb>=1.1,<3",  # collector: raw GDELT processing
  "httpx>=0.27,<1",  # collector: GDELT, RSS, Wikipedia downloads
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsalert"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
